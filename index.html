<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>campoeletrico</title>
  </head>
  <body>
    <div class="container mt-2">
      
      <main class="canvaswrapper d-flex justify-content-center align-items-center mx-auto flex-column">

        <!-- Canvas -->
        <canvas class="rounded d-block mx-auto img-fluid mb-3" id="glcanvas" width="800" height="800"></canvas>
        
        <section class="d-flex w-100 flex-row justify-content-between gap-2">
          <!-- Botões -->
          <aside id="modeSelector" class="d-flex flex-column gap-2">
            <button data-mode="selection" class="tool-btn tool-btn-active rounded"><i class="bi bi-mouse"></i></button>
            <button data-mode="create_charge" class="tool-btn rounded"><i class="bi bi-plus-circle-dotted"></i></button>
            <button data-mode="create_test_charge" class="tool-btn rounded"><i class="bi bi-dot"></i></button>
          </aside>
          <!-- Menu de propriedades -->
          <aside id="propertyMenu" class="rounded bg-transparent-black p-3 flex-grow-1 property-bar">
            <span class="mb-0 fw-bold">Propriedades</span>
            <span id="status">(nenhum objeto selecionado)</span>
            <div id="propertyForm">
              
            </div>
          </aside>
        </section>
        <form class="w-100 mt-2">
            <input type="checkbox" id="lines" class="form-check-input" checked> Mostrar linhas de campo<br>
            <input type="checkbox" id="arrows" class="form-check-input"> Mostrar grade de vetores <br>
            Background: <br>
            <input type="radio" name="bg" value="n" class="form-check-input" checked> Nenhum <br>
            <input type="radio" name="bg" value="1" class="form-check-input"> Potência do campo elétrico <br>
            <input type="radio" name="bg" value="2" class="form-check-input"> Diferença de potencial <br>
            <input type="radio" name="bg" value="0" class="form-check-input"> Direção do campo elétrico <br>
        </form>
      </main>
      <hr class="border">

        <!-- <canvas id="maincanvas" width="8000" height="8000"></canvas><br> -->
      <!-- x <input type="number" id="x" placeholder="x" value="10">
      y <input type="number" id="y" placeholder="y" value="10"> -->
      
      <!-- <button class="btn btn-primary"></button> -->
    </div>
      
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
